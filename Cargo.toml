[package]
name = "orbital-canvas"
version = "18.0.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/almadar-io/orbital-canvas"
description = "GPU canvas embedded by Orbital hosts (iOS, Android, Rust)"

[features]
default = []
# HTTP(S) asset fetching (ureq/rustls) — native-only; off on wasm32 and in
# minimal builds. Local files (`file://`, absolute, relative) work without it.
http = ["orbital-canvas-paint/http"]
# Desktop hosts: supply the scripts the bundled faces lack from the installed system fonts.
system-fonts = ["orbital-canvas-paint/system-fonts"]

[dependencies]
orbital-canvas-base = { path = "crates/base" }
orbital-canvas-paint = { path = "crates/paint" }
orbital-canvas-map = { path = "crates/map" }
orbital-canvas-patterns = { path = "crates/patterns" }
orbital-canvas-render = { path = "crates/render" }
orbital-core-base = { git = "https://github.com/almadar-io/orbital-core", branch = "main" }
wgpu = "26"
pollster = "0.4"
# Every default format but `avif`, which is only the AV1 encoder (rav1e); canvas encodes PNG only.
image = { version = "0.25", default-features = false, features = ["rayon", "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
raw-window-handle = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL2 is the fallback where a browser has no WebGPU (owner ruling 2026-11-06): plain scenes draw, no compute.
wgpu = { version = "26", features = ["webgl", "fragile-send-sync-non-atomic-wasm"] }
web-sys = { version = "0.3", features = ["Window", "Response", "Headers", "HtmlCanvasElement"] }

[dev-dependencies]
# The kernel the native orb embeds: every workspace crate's tests share its one build (P-036 pins).
orbital-core = { git = "https://github.com/almadar-io/orbital-core", branch = "main", features = ["native"] }
orbital-canvas-base = { path = "crates/base", features = ["test-support"] }
orbital-canvas-paint = { path = "crates/paint", features = ["test-support"] }
orbital-canvas-map = { path = "crates/map", features = ["test-support"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
